AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CourseFlow backend on AWS: the Docker image from ECR runs on one EC2
  instance behind nginx, fronted by CloudFront for HTTPS. Logs go to
  CloudWatch. GitHub Actions deploys through SSM (no SSH) using an OIDC
  role (no long-lived keys).

Parameters:
  GitHubRepo:
    Type: String
    Default: CodesProS/CourseFlow
    Description: owner/repo allowed to assume the deploy role (main branch only)
  EcrRepositoryName:
    Type: String
    Default: courseflow-backend
  InstanceType:
    Type: String
    Default: t3.micro
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  CloudFrontPrefixList:
    Type: String
    Default: pl-3b927c52 # com.amazonaws.global.cloudfront.origin-facing in us-east-1
    Description: Only CloudFront can reach the instance on port 80
  BudgetEmail:
    Type: String
    Default: ""
    Description: Email for the monthly spend alert; leave empty to skip the budget

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  # --- CI/CD: GitHub Actions assumes this role via OIDC ---------------------

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: courseflow-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId

  # --- The server ------------------------------------------------------------

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /courseflow/backend
      RetentionInDays: 14

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore # deploys via SSM, no SSH
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub ${LogGroup.Arn}:*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CourseFlow API - HTTP from CloudFront only, no SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixList

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required # IMDSv2 only
          HttpEndpoint: enabled
        UserData:
          Fn::Base64: |
            #!/bin/bash
            # Host setup: Docker runs the API, nginx on :80 proxies to whichever
            # container is live (blue :3001 / green :3002). infra/aws/remote-deploy.sh
            # flips between them.
            set -euxo pipefail
            dnf install -y docker nginx
            systemctl enable --now docker

            cat > /etc/nginx/nginx.conf <<'NGINX'
            user nginx;
            worker_processes auto;
            error_log /var/log/nginx/error.log notice;
            pid /run/nginx.pid;
            events { worker_connections 1024; }
            http {
                access_log /var/log/nginx/access.log;
                upstream courseflow_backend { include /etc/nginx/courseflow-upstream.inc; }
                server {
                    listen 80 default_server;
                    location / {
                        proxy_pass http://courseflow_backend;
                        proxy_set_header Host $host;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto https;
                    }
                }
            }
            NGINX
            echo "server 127.0.0.1:3001;" > /etc/nginx/courseflow-upstream.inc
            systemctl enable --now nginx

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt InstanceSecurityGroup.GroupId]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Name, Value: courseflow-api }

  # --- HTTPS in front of the instance -----------------------------------------

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: CourseFlow API
        PriceClass: PriceClass_100
        Origins:
          - Id: ec2
            DomainName: !GetAtt Instance.PublicDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: ec2
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  # --- Spend alert -------------------------------------------------------------

  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: courseflow-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 10, Unit: USD }
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

Outputs:
  ApiUrl:
    Value: !Sub https://${Distribution.DomainName}
  InstanceId:
    Value: !Ref Instance
  DeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  LogGroupName:
    Value: !Ref LogGroup
