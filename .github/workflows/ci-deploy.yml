name: CI / Deploy to AWS

# Every push and PR: typecheck, test, lint, build.
# Pushes to main also: build the backend image, push it to ECR, and roll it
# out to EC2 through SSM (zero-downtime blue/green, see infra/aws).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role, no stored AWS keys

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::802320708479:role/courseflow-github-deploy
  ECR_REPOSITORY: courseflow-backend
  STACK_NAME: courseflow
  CORS_ORIGIN: https://course-flow-three.vercel.app,http://localhost:5173

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install, typecheck, build
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Backend - scheduler matches exhaustive search
        working-directory: backend
        run: |
          npx ts-node src/scripts/benchmark.ts | tee benchmark.txt
          ! grep -q "match: NO" benchmark.txt

      - name: Frontend - install, lint, test, build
        working-directory: frontend
        run: |
          npm ci
          npx eslint src
          npm test
          npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-aws # one rollout at a time
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Read stack outputs
        id: stack
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "instance=$(out InstanceId)" >> "$GITHUB_OUTPUT"
          echo "api=$(out ApiUrl)" >> "$GITHUB_OUTPUT"

      - name: Roll out on EC2 via SSM
        run: |
          jq -n \
            --arg image "${{ steps.image.outputs.uri }}" \
            --arg cors "$CORS_ORIGIN" \
            --rawfile script infra/aws/remote-deploy.sh \
            '{commands: ["export IMAGE=\($image)", "export CORS_ORIGIN=\"\($cors)\"", $script]}' > params.json
          CMD=$(aws ssm send-command \
            --instance-ids "${{ steps.stack.outputs.instance }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::12}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD" --instance-id "${{ steps.stack.outputs.instance }}" || true
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "${{ steps.stack.outputs.instance }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "${{ steps.stack.outputs.instance }}" --query Status --output text)
          test "$STATUS" = Success

      - name: Smoke test through CloudFront
        run: |
          API="${{ steps.stack.outputs.api }}"
          curl -fsS "$API/health"
          COUNT=$(curl -fsS "$API/courses" | jq length)
          echo "Catalog size: $COUNT"
          test "$COUNT" -gt 1000
